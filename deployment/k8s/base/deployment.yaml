apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  labels:
    app.kubernetes.io/part-of: quantuml
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: model-server
          image: quantuml/model-server:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TASK
              value: "pqc" # patched per overlay
            - name: ADAPTER_REVISION
              value: "main" # pin to a commit SHA for immutable promotion
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: appinsights
                  key: connection-string
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 60 # up to 10 min for model load + adapter pull
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
