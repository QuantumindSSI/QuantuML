apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quantuml
nameSuffix: -crypto
commonLabels:
  quantuml.io/task: crypto
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: crypto
