# QuantuML - PQC Migration Advisor v3 - MLX-LM LoRA config (Apple Silicon)
# v3 = mixed dataset: 50% real-world (Neura-parse, source-verified against
# NIST FIPS 203/204/205 + IR 8547, CC-BY-4.0) + 50% synthetic templates.
# Exact split: data/mlx_pqc_v3/manifest.json
# Hyperparameters mirror configs/config_pqc_v2.yaml (r=16, alpha=32 -> scale 2.0,
# dropout 0.05, lr 2e-4 cosine, effective batch 16, seq 1024, seed 42).
#
# Run:
#   ./venv/bin/python -m mlx_lm lora -c configs/mlx_lora_pqc_v3.yaml
# Iters math: 9350 train samples x 2 epochs / batch_size 4 = 4675 -> 4680

model: "./base_model"
train: true
data: "./data/mlx_pqc_v3"
seed: 42

fine_tune_type: lora
optimizer: adamw
num_layers: -1

batch_size: 4
grad_accumulation_steps: 4
iters: 4680
max_seq_length: 1024
grad_checkpoint: true

learning_rate: 2.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 140             # ~0.03 * 4680
  warmup_init: 1.0e-7
  arguments: [2.0e-4, 4680, 0.0]

lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"
  rank: 16
  scale: 2.0
  dropout: 0.05

adapter_path: "./outputs/mlx_adapters/pqc_v3"
save_every: 500
steps_per_report: 25
steps_per_eval: 500
val_batches: 25
test: true
test_batches: -1
